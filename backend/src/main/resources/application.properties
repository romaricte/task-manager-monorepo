spring.application.name=task-manager

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_manager_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:task_manager}
spring.datasource.password=${DB_PASSWORD:task_manager_password}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-with-at-least-32-characters}
app.jwt.expiration=${JWT_EXPIRATION:86400}
app.jwt.issuer=${JWT_ISSUER:task-manager-api}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
