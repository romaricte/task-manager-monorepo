spring.datasource.url=jdbc:h2:mem:task_manager_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-key-with-at-least-thirty-two-characters-long
app.jwt.expiration=3600
app.jwt.issuer=task-manager-test
app.cors.allowed-origins=http://localhost:3000
